<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Search Indexing Pipeline</title><desc id="d">Database changes flow through CDC and indexing workers into a search engine.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#94a3b8"/></marker></defs><rect width="900" height="360" fill="#0b1322"/><g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><path d="M170 180H270"/><path d="M400 180H500"/><path d="M630 180H730"/></g><g font-family="system-ui" text-anchor="middle" fill="#172033"><rect x="30" y="135" width="140" height="90" rx="16" fill="#99f6e4" stroke="#2dd4bf"/><text x="100" y="174" font-size="18" font-weight="700">Database</text><text x="100" y="199" font-size="13">source of truth</text><rect x="270" y="135" width="130" height="90" rx="16" fill="#fde68a" stroke="#f59e0b"/><text x="335" y="174" font-size="18" font-weight="700">CDC Log</text><text x="335" y="199" font-size="13">ordered changes</text><rect x="500" y="125" width="130" height="110" rx="16" fill="#c7d2fe" stroke="#818cf8"/><text x="565" y="165" font-size="17" font-weight="700">Indexer</text><text x="565" y="191" font-size="13">tokenize</text><text x="565" y="212" font-size="13">enrich + retry</text><rect x="730" y="125" width="140" height="110" rx="16" fill="#bfdbfe" stroke="#60a5fa"/><text x="800" y="166" font-size="17" font-weight="700">Search Index</text><text x="800" y="192" font-size="13">BM25 + vector</text><text x="800" y="213" font-size="13">eventual view</text></g><text x="450" y="330" text-anchor="middle" font-family="system-ui" fill="#a3adbd" font-size="13">Reindex tanpa downtime · ukur freshness lag · jangan jadikan index source of truth</text></svg>
