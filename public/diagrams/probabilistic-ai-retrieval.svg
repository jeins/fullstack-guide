<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d"><title id="t">Probabilistic Data dan AI Retrieval</title><desc id="d">Bloom filter menghindari lookup yang pasti tidak ada dan pipeline RAG mengambil context sebelum generation.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#94a3b8"/></marker></defs><rect width="900" height="470" fill="#0b1322"/><g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><path d="M180 145H300"/><path d="M450 145H580"/><path d="M705 145H800"/><path d="M180 340H300"/><path d="M430 340H545"/><path d="M675 340H790"/></g><g font-family="system-ui" text-anchor="middle" fill="#172033"><rect x="35" y="110" width="145" height="70" rx="16" fill="#bfdbfe" stroke="#60a5fa"/><text x="107" y="151" font-size="18" font-weight="700">Key lookup</text><rect x="300" y="100" width="150" height="90" rx="16" fill="#fde68a" stroke="#f59e0b"/><text x="375" y="136" font-size="18" font-weight="700">Bloom Filter</text><text x="375" y="162" font-size="12">absent / maybe</text><rect x="580" y="110" width="125" height="70" rx="16" fill="#99f6e4" stroke="#2dd4bf"/><text x="642" y="151" font-size="17" font-weight="700">Storage</text><rect x="800" y="110" width="65" height="70" rx="16" fill="#fecaca" stroke="#f87171"/><text x="832" y="139" font-size="12" font-weight="700">Skip</text><text x="832" y="158" font-size="11">if absent</text><rect x="35" y="305" width="145" height="70" rx="16" fill="#bfdbfe" stroke="#60a5fa"/><text x="107" y="346" font-size="18" font-weight="700">Question</text><rect x="300" y="295" width="130" height="90" rx="16" fill="#c7d2fe" stroke="#818cf8"/><text x="365" y="332" font-size="17" font-weight="700">Hybrid</text><text x="365" y="357" font-size="12">BM25 + vector</text><rect x="545" y="295" width="130" height="90" rx="16" fill="#fde68a" stroke="#f59e0b"/><text x="610" y="332" font-size="17" font-weight="700">Context</text><text x="610" y="357" font-size="12">filter + rerank</text><rect x="790" y="295" width="80" height="90" rx="16" fill="#99f6e4" stroke="#2dd4bf"/><text x="830" y="332" font-size="17" font-weight="700">LLM</text><text x="830" y="357" font-size="12">answer</text></g><text x="450" y="50" text-anchor="middle" font-family="system-ui" fill="#e8eef8" font-size="22" font-weight="700">Kurangi cost, lalu tingkatkan relevance</text><text x="450" y="435" text-anchor="middle" font-family="system-ui" fill="#a3adbd" font-size="13">False-positive rate · retrieval recall · groundedness · authorization · freshness</text></svg>
