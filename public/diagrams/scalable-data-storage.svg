<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
<title id="t">Scalable Data Storage</title><desc id="d">Application router distributes writes to shards and reads to replicas.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#94a3b8"/></marker></defs>
<rect width="900" height="360" fill="#0b1322"/><g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><path d="M170 180H300"/><path d="M430 180H545V80H650"/><path d="M430 180H650"/><path d="M430 180H545V280H650"/></g>
<g font-family="system-ui" text-anchor="middle"><g fill="#172033" stroke="#7dd3fc"><rect x="40" y="135" width="130" height="90" rx="16" fill="#bfdbfe"/><text x="105" y="174" font-size="18" font-weight="700">Service</text><text x="105" y="199" font-size="13">read + write</text></g><g><rect x="300" y="130" width="130" height="100" rx="16" fill="#c7d2fe" stroke="#818cf8"/><text x="365" y="173" font-size="18" font-weight="700" fill="#172033">Data Router</text><text x="365" y="198" font-size="13" fill="#334155">shard key</text></g><g fill="#172033"><rect x="650" y="40" width="180" height="80" rx="16" fill="#99f6e4" stroke="#2dd4bf"/><text x="740" y="75" font-size="17" font-weight="700">Shard A</text><text x="740" y="98" font-size="13">primary + replica</text><rect x="650" y="140" width="180" height="80" rx="16" fill="#99f6e4" stroke="#2dd4bf"/><text x="740" y="175" font-size="17" font-weight="700">Shard B</text><text x="740" y="198" font-size="13">primary + replica</text><rect x="650" y="240" width="180" height="80" rx="16" fill="#fecaca" stroke="#fb7185"/><text x="740" y="275" font-size="17" font-weight="700">Hot Shard</text><text x="740" y="298" font-size="13">skew / overload</text></g><text x="450" y="342" fill="#a3adbd" font-size="13">Replica menskalakan read · shard menskalakan write dan storage</text></g>
</svg>
