<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Caching Architecture</title><desc id="d">Cache aside flow from client to service, cache, and database.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#94a3b8"/></marker></defs><rect width="900" height="360" fill="#0b1322"/><g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><path d="M170 180H285"/><path d="M415 160H590"/><path d="M415 205C500 205 505 285 590 285"/><path d="M680 245V215"/></g><g font-family="system-ui" text-anchor="middle" fill="#172033"><rect x="40" y="140" width="130" height="80" rx="16" fill="#bfdbfe" stroke="#60a5fa"/><text x="105" y="187" font-size="18" font-weight="700">Client</text><rect x="285" y="125" width="130" height="110" rx="16" fill="#c7d2fe" stroke="#818cf8"/><text x="350" y="175" font-size="18" font-weight="700">Service</text><text x="350" y="199" font-size="13">cache-aside</text><rect x="590" y="115" width="180" height="100" rx="16" fill="#fde68a" stroke="#f59e0b"/><text x="680" y="158" font-size="18" font-weight="700">Redis Cache</text><text x="680" y="184" font-size="13">TTL + jitter</text><rect x="590" y="245" width="180" height="80" rx="16" fill="#99f6e4" stroke="#2dd4bf"/><text x="680" y="292" font-size="18" font-weight="700">Database</text></g><g font-family="system-ui" fill="#a3adbd" font-size="13"><text x="490" y="148">1. lookup</text><text x="472" y="252">2. miss fallback</text><text x="698" y="235">3. populate</text><text x="450" y="345">Write: commit ke DB lalu update/invalidate key cache</text></g></svg>
