<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Asynchronous Processing</title><desc id="d">Transactional outbox and relay publish events to a broker and consumers.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#94a3b8"/></marker></defs><rect width="900" height="360" fill="#0b1322"/><g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><path d="M160 180H260"/><path d="M390 180H490"/><path d="M620 180H735"/></g><g font-family="system-ui" text-anchor="middle" fill="#172033"><rect x="30" y="140" width="130" height="80" rx="16" fill="#bfdbfe" stroke="#60a5fa"/><text x="95" y="187" font-size="18" font-weight="700">Service</text><rect x="260" y="105" width="130" height="150" rx="16" fill="#99f6e4" stroke="#2dd4bf"/><text x="325" y="145" font-size="17" font-weight="700">Database</text><rect x="278" y="165" width="94" height="34" rx="8" fill="#ccfbf1"/><text x="325" y="187" font-size="12">business data</text><rect x="278" y="207" width="94" height="34" rx="8" fill="#fde68a"/><text x="325" y="229" font-size="12">outbox</text><rect x="490" y="135" width="130" height="90" rx="16" fill="#c7d2fe" stroke="#818cf8"/><text x="555" y="175" font-size="18" font-weight="700">Relay</text><text x="555" y="198" font-size="13">retry + ack</text><rect x="735" y="130" width="135" height="100" rx="16" fill="#fde68a" stroke="#f59e0b"/><text x="802" y="173" font-size="18" font-weight="700">Broker</text><text x="802" y="198" font-size="13">queue / stream</text></g><text x="450" y="330" text-anchor="middle" font-family="system-ui" fill="#a3adbd" font-size="13">Atomic DB commit · at-least-once delivery · idempotent consumers</text></svg>
