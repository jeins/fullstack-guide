<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d"><title id="t">Messaging dan Backpressure</title><desc id="d">Producer mengirim ke bounded broker, consumer memproses, retry masuk DLQ, dan backpressure kembali ke producer.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#94a3b8"/></marker></defs><rect width="900" height="450" fill="#0b1322"/><g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><path d="M175 190H280"/><path d="M430 190H535"/><path d="M685 190H775"/><path d="M610 235V325H720"/><path d="M280 145H175V115" stroke="#f59e0b"/></g><g font-family="system-ui" text-anchor="middle" fill="#172033"><rect x="40" y="150" width="135" height="80" rx="16" fill="#bfdbfe" stroke="#60a5fa"/><text x="107" y="197" font-size="18" font-weight="700">Producer</text><rect x="280" y="130" width="150" height="120" rx="16" fill="#fde68a" stroke="#f59e0b"/><text x="355" y="177" font-size="18" font-weight="700">Bounded Broker</text><text x="355" y="204" font-size="13">queue / stream</text><text x="355" y="226" font-size="12">lag + oldest age</text><rect x="535" y="150" width="150" height="80" rx="16" fill="#c7d2fe" stroke="#818cf8"/><text x="610" y="183" font-size="18" font-weight="700">Consumers</text><text x="610" y="208" font-size="13">limited concurrency</text><rect x="775" y="150" width="100" height="80" rx="16" fill="#99f6e4" stroke="#2dd4bf"/><text x="825" y="183" font-size="16" font-weight="700">Effect</text><text x="825" y="208" font-size="12">idempotent</text><rect x="720" y="300" width="155" height="80" rx="16" fill="#fecaca" stroke="#f87171"/><text x="797" y="333" font-size="17" font-weight="700">DLQ</text><text x="797" y="358" font-size="12">inspect + replay</text><rect x="40" y="55" width="135" height="60" rx="14" fill="#fed7aa" stroke="#fb923c"/><text x="107" y="80" font-size="15" font-weight="700">Backpressure</text><text x="107" y="100" font-size="11">slow / reject</text></g><text x="450" y="40" text-anchor="middle" font-family="system-ui" fill="#e8eef8" font-size="22" font-weight="700">Overload harus terlihat sebelum buffer habis</text><text x="450" y="420" text-anchor="middle" font-family="system-ui" fill="#a3adbd" font-size="13">Retry dengan backoff · poison message diisolasi · DLQ wajib memiliki owner</text></svg>
