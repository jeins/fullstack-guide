<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Realtime Communication</title><desc id="d">Perbandingan polling, Server-Sent Events, dan WebSocket.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#94a3b8"/></marker></defs><rect width="900" height="440" fill="#0b1322"/><g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><path d="M210 145H690"/><path d="M690 230H210"/><path d="M210 330H690"/><path d="M690 350H210"/></g><g font-family="system-ui" text-anchor="middle" fill="#172033"><rect x="45" y="100" width="165" height="280" rx="18" fill="#bfdbfe" stroke="#60a5fa"/><text x="127" y="235" font-size="20" font-weight="700">Client</text><text x="127" y="262" font-size="13">web / mobile</text><rect x="690" y="100" width="165" height="280" rx="18" fill="#c7d2fe" stroke="#818cf8"/><text x="772" y="225" font-size="20" font-weight="700">Gateway</text><text x="772" y="252" font-size="13">registry + broker</text><text x="450" y="128" fill="#93c5fd" font-size="15" font-weight="700">Polling: request berkala →</text><text x="450" y="215" fill="#5eead4" font-size="15" font-weight="700">← SSE: server push satu arah</text><text x="450" y="308" fill="#fbbf24" font-size="15" font-weight="700">WebSocket: full duplex ↔</text></g><text x="450" y="55" text-anchor="middle" font-family="system-ui" fill="#e8eef8" font-size="22" font-weight="700">Pilih protocol dari arah komunikasi</text><text x="450" y="410" text-anchor="middle" font-family="system-ui" fill="#a3adbd" font-size="13">Heartbeat · reconnect · resume cursor · slow-consumer policy · durable history</text></svg>
